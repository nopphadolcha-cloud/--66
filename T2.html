<!-- Hero Section -->
<section class="hero text-center my-4">

    <p>รู้จักขยะแต่ละประเภท เพื่อการแยกที่ถูกต้อง</p>

<!-- Content Sections (Organic, General, Hazardous, Recyclable) -->
<!-- สามารถใช้โค้ดจาก HTML ของคุณที่ส่งมาก่อนได้ -->

<!-- Modal Contact Form -->
<div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel">ติดต่อเรา</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label>ชื่อ-นามสกุล *</label>
                        <input type="text" class="form-control" required placeholder="กรอกชื่อ-นามสกุล">
                    </div>
                    <div class="mb-3">
                        <label>E-mail *</label>
                        <input type="email" class="form-control" required placeholder="example@domain.com">
                    </div>
                    <div class="mb-3">
                        <label>เบอร์โทรศัพท์</label>
                        <input type="tel" class="form-control" placeholder="0XX-XXX-XXXX">
                    </div>
                    <div class="mb-3">
                        <label>เรื่องที่ต้องการติดต่อ *</label>
                        <select class="form-select" required>
                            <option value="">-- กรุณาระบุเรื่องที่ต้องการติดต่อ --</option>
                            <option value="question">สอบถามข้อมูล</option>
                            <option value="suggestion">ข้อเสนอแนะ</option>
                            <option value="cooperation">ประสานงานความร่วมมือ</option>
                            <option value="complaint">ร้องเรียน</option>
                            <option value="other">อื่นๆ</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>รายละเอียด</label>
                        <textarea class="form-control" rows="5"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" data-bs-dismiss="modal">ยกเลิก</button>
                <button class="btn btn-outline-success">ส่งข้อมูล</button>
            </div>
        </div>
    </div>
</div>

        </div>
    </div>
</footer>
